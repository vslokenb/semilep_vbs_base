# Custom bin edges for SR histograms.

# Edges must be a subset of the original coffea BDT score bin edges
# (the coffea histograms use 40 uniform bins over [0, 1], so valid edges
# are multiples of 0.025: 0.0, 0.025, 0.05, ..., 0.975, 1.0).
#
# SRs not listed here fall back to the uniform REBIN_TARGETS default.
#
# Usage:
#   python3 python/make_histograms_SRonly.py \
#       --config config/inputs_2022postEE.yaml \
#       --binning config/binning_example.yaml \
#       --output histograms/histograms_SRonly_varbin.root

