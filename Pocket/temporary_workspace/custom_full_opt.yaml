queue: workday
mem-per-worker: 24
scaleout: 50
cores-per-worker: 1
chunksize: 25000
adaptive: false
skip-bad-files: false
custom-setup-commands:
  - echo $HOME
  - source /usr/local/etc/profile.d/conda.sh
  - conda activate /work/users/vsloken-fnal/envs/my-env
  - export PATH="/work/users/vsloken-fnal/envs/my-env/bin:$PATH"
  - export PYTHONPATH='/work/users/vsloken-fnal/latest_poco/PocketCoffea'
  - echo $PYTHONPATH
  - export LD_LIBRARY_PATH=$CONDA_PREFIX/lib:$LD_LIBRARY_PATH
local-virtualenv: false

